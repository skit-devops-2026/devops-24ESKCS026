apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-finder
  labels:
    app.kubernetes.io/name: pg-finder
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-finder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-finder
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: pg-finder
          image: ghcr.io/skit-devops-2026/devops-24eskcs026:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
